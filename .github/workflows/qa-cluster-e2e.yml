# Generated by QACluster (codegen-base.mjs): runs the E2E framework in e2e/ on PRs and on pushes to the listed branches.
# Does not use QACluster or Claude. Playwright's webServer (e2e/playwright.config.ts) starts the app.
name: e2e

on:
  pull_request:
    paths: ['**']
  push:
    branches: [main, master, 'qa/**']
    paths: ['**']
  workflow_dispatch:                                # the "Run workflow" button shows once this file is on the default branch

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      BASE_URL: ${{ vars.BASE_URL }}                # empty → the app started in this job is used
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - run: npx bddgen && npx playwright test      # the summary reporter also writes the case table to the job Summary

      # The runner's memory and any process the kernel killed for lack of it: what explains a run that dies without a result
      - name: Runner resources
        if: always()
        run: |
          mkdir -p test-results
          { free -m; echo; sudo dmesg | grep -iE 'out of memory|oom-kill|killed process' || echo "no OOM kills"; } | tee test-results/runner-resources.txt

      # The reports, also when the job fails or times out (a timeout counts as cancelled)
      - name: Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/cucumber-report/
            e2e/test-results/
          retention-days: 14

